<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PF Rescue – get your stuck PF money out</title>
  <meta name="description" content="PF claim rejected or stuck? Find out exactly why, get the fix in your language, ready-made letters to EPFO, and reminders until the money reaches your bank. Free to start.">
  <meta property="og:title" content="PF Rescue – your PF money is stuck. Let's get it out.">
  <meta property="og:description" content="Rejected or stuck EPF claim? Find the real problem, get the fix and ready-made EPFO letters, in your language.">
  <meta name="theme-color" content="#f6f1e6">
  <meta name="color-scheme" content="light only">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a href="/" class="logo"><img src="/icon.svg" alt="" width="30" height="30"> <span data-t="appName">PF Rescue</span></a>
      <label class="lang-pick"><span class="sr" data-t="chooseLang">Language</span>
        <select id="lang"></select>
      </label>
      <button type="button" class="btn small top-cta" id="topCta" data-t="ctaStart">Check my claim</button>
    </div>
  </header>
  <main id="app" tabindex="-1" aria-live="polite"><noscript><div class="wrap">Please turn on JavaScript to use PF Rescue.</div></noscript></main>
  <footer class="foot"><div class="wide"><span data-t="footer"></span><span>© PF Rescue</span></div></footer>
  <script src="/i18n.js"></script>
  <script src="/i18n-landing.js"></script>
  <script src="/i18n-chat.js"></script>
  <script src="/icons.js"></script>
  <script src="/ui.js"></script>
  <script src="/chat.js"></script>
  <script src="/app.js"></script>
</body>
</html>
